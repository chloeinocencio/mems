<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=375, maximum-scale=1" />
<title>mems — preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    color: #fff;
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 40px 20px;
  }

  /* Phone shell */
  .phone {
    width: 375px;
    min-height: 812px;
    background: #000;
    border-radius: 44px;
    border: 2px solid #222;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 1px #333, 0 40px 80px rgba(0,0,0,0.8);
  }

  /* Notch */
  .notch {
    width: 120px;
    height: 28px;
    background: #000;
    border: 2px solid #222;
    border-radius: 0 0 18px 18px;
    margin: 0 auto;
    position: relative;
    z-index: 10;
  }

  .screen {
    padding: 12px 16px 40px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 12px 4px 0;
    margin-bottom: 24px;
  }
  .header-spacer { width: 40px; }
  .header-center { text-align: center; }
  .month-name {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 4px;
    line-height: 1;
  }
  .year-num {
    font-size: 16px;
    font-weight: 300;
    letter-spacing: 5px;
    opacity: 0.85;
    margin-top: 2px;
  }
  .cal-icon {
    font-size: 28px;
    padding-top: 4px;
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .day-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .cell-box {
    width: 100%;
    aspect-ratio: 4/5;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .cell-empty {
    border: 1.5px dashed rgba(255,255,255,0.7);
  }

  .cell-today {
    border: 2px dashed #fff;
  }

  .cell-future {
    border: 1.5px dashed rgba(255,255,255,0.25);
  }

  .plus {
    font-size: 26px;
    font-weight: 200;
    color: #fff;
    line-height: 1;
  }

  .plus-faint { opacity: 0.3; }

  .day-num {
    font-size: 12px;
    font-weight: 300;
    letter-spacing: 1px;
    color: #fff;
  }
  .day-num-faint { opacity: 0.3; }

  /* Photo cell with vintage filter */
  .cell-photo {
    border: none;
    background-size: cover;
    background-position: center;
  }
  .cell-photo::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(110, 60, 10, 0.32);
    pointer-events: none;
  }
  /* Vignette corners */
  .cell-photo::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 0% 0%, rgba(0,0,0,0.45) 0%, transparent 60%),
      radial-gradient(ellipse at 100% 100%, rgba(0,0,0,0.45) 0%, transparent 60%);
    pointer-events: none;
    z-index: 1;
  }

  /* Screens nav */
  .screens {
    display: flex;
    gap: 16px;
    margin-top: 40px;
    justify-content: center;
    flex-wrap: wrap;
    width: 100%;
    max-width: 900px;
  }
  .screen-btn {
    background: none;
    border: 1px solid #444;
    color: #888;
    padding: 8px 20px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    transition: border-color 0.2s, color 0.2s;
  }
  .screen-btn:hover, .screen-btn.active {
    border-color: #fff;
    color: #fff;
  }

  /* Camera screen */
  .camera-screen {
    display: none;
    position: relative;
    background: #111;
    min-height: 750px;
  }
  .camera-viewfinder {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .camera-viewfinder::after {
    content: '📷';
    font-size: 48px;
    opacity: 0.15;
  }
  .camera-top-bar {
    position: absolute;
    top: 20px;
    left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px;
    z-index: 2;
  }
  .icon-btn {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    cursor: pointer;
  }
  .date-label {
    font-size: 13px;
    letter-spacing: 2px;
    font-weight: 300;
  }
  .camera-bottom-bar {
    position: absolute;
    bottom: 48px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    z-index: 2;
  }
  .shutter {
    width: 76px; height: 76px;
    border-radius: 50%;
    border: 3px solid #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .shutter-inner {
    width: 60px; height: 60px;
    border-radius: 50%;
    background: #fff;
  }

  /* Recap screen */
  .recap-screen {
    display: none;
    position: relative;
    min-height: 750px;
    overflow: hidden;
  }
  .recap-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
  }
  .recap-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(110, 60, 10, 0.32);
  }
  .recap-top-overlay {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 180px;
    background: rgba(0,0,0,0.55);
    z-index: 1;
  }
  .recap-bottom-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 220px;
    background: rgba(0,0,0,0.65);
    z-index: 1;
  }
  .recap-top-bar {
    position: absolute;
    top: 20px; left: 0; right: 0;
    padding: 0 20px;
    z-index: 2;
  }
  .progress-track {
    height: 2px;
    background: rgba(255,255,255,0.3);
    border-radius: 1px;
    margin-bottom: 16px;
  }
  .progress-fill {
    height: 100%;
    background: #fff;
    border-radius: 1px;
    width: 45%;
  }
  .recap-header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .recap-title {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 3px;
  }
  .recap-year {
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 3px;
    opacity: 0.7;
  }
  .recap-day-label {
    position: absolute;
    bottom: 200px;
    left: 20px;
    z-index: 2;
    font-size: 64px;
    font-weight: 900;
    letter-spacing: -2px;
    opacity: 0.6;
  }
  .recap-bottom-bar {
    position: absolute;
    bottom: 48px;
    left: 0; right: 0;
    padding: 0 32px;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .replay-btn {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 24px;
    padding: 10px 20px;
    font-size: 14px;
    letter-spacing: 1px;
    color: #fff;
    cursor: pointer;
    background: none;
    font-family: inherit;
  }
  .action-row {
    display: flex;
    gap: 16px;
    width: 100%;
  }
  .action-btn {
    flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px;
    border-radius: 4px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.5px;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>

<div style="display:flex;flex-direction:column;align-items:center;gap:20px;width:100%">

  <!-- Screen switcher -->
  <div class="screens">
    <button class="screen-btn active" onclick="show('calendar')">Calendar</button>
    <button class="screen-btn" onclick="show('camera')">Camera</button>
    <button class="screen-btn" onclick="show('recap')">Recap</button>
  </div>

  <div class="phone">
    <div class="notch"></div>

    <!-- ── CALENDAR SCREEN ── -->
    <div id="screen-calendar" class="screen">
      <div class="header">
        <div class="header-spacer"></div>
        <div class="header-center">
          <div class="month-name">JUNE</div>
          <div class="year-num">2026</div>
        </div>
        <div class="cal-icon">🗓</div>
      </div>

      <div class="grid" id="cal-grid"></div>
    </div>

    <!-- ── CAMERA SCREEN ── -->
    <div id="screen-camera" class="camera-screen">
      <div class="camera-viewfinder"></div>
      <div class="camera-top-bar">
        <div class="icon-btn">‹</div>
        <div class="date-label">04 / 06 / 2026</div>
        <div class="icon-btn">⇄</div>
      </div>
      <div class="camera-bottom-bar">
        <div class="shutter"><div class="shutter-inner"></div></div>
      </div>
    </div>

    <!-- ── RECAP SCREEN ── -->
    <div id="screen-recap" class="recap-screen">
      <div class="recap-bg" style="background-image: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400&q=60')"></div>
      <div class="recap-top-overlay"></div>
      <div class="recap-bottom-overlay"></div>
      <div class="recap-top-bar">
        <div class="progress-track"><div class="progress-fill"></div></div>
        <div class="recap-header-row">
          <div>
            <div class="recap-title">MAY</div>
            <div class="recap-year">2026</div>
          </div>
          <div class="icon-btn">✕</div>
        </div>
      </div>
      <div class="recap-day-label">14</div>
      <div class="recap-bottom-bar">
        <button class="replay-btn">↺ &nbsp;Replay</button>
        <div class="action-row">
          <button class="action-btn">⬇ Save All</button>
          <button class="action-btn">↗ Share</button>
        </div>
      </div>
    </div>

  </div><!-- /phone -->
</div>

<script>
  // Build calendar grid for June 2026 (today = Jun 4)
  const today = 4;
  const daysInMonth = 30;
  // Fake photos for days 1–3 (already past)
  const fakePhotos = {
    1: 'https://images.unsplash.com/photo-1501854140801-50d01698950b?w=200&q=60',
    2: 'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=200&q=60',
    3: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=200&q=60',
  };

  const grid = document.getElementById('cal-grid');
  for (let d = 1; d <= daysInMonth; d++) {
    const wrapper = document.createElement('div');
    wrapper.className = 'day-cell';

    const box = document.createElement('div');
    box.className = 'cell-box';

    if (fakePhotos[d]) {
      box.classList.add('cell-photo');
      box.style.backgroundImage = `url('${fakePhotos[d]}')`;
    } else if (d === today) {
      box.classList.add('cell-today');
      box.innerHTML = '<span class="plus">+</span>';
    } else if (d > today) {
      box.classList.add('cell-future');
      box.innerHTML = '<span class="plus plus-faint">+</span>';
    } else {
      box.classList.add('cell-empty');
      box.innerHTML = '<span class="plus">+</span>';
    }

    const label = document.createElement('span');
    label.className = d > today ? 'day-num day-num-faint' : 'day-num';
    label.textContent = d;

    wrapper.appendChild(box);
    wrapper.appendChild(label);
    grid.appendChild(wrapper);
  }

  // Screen switcher
  function show(name) {
    ['calendar','camera','recap'].forEach(s => {
      const el = document.getElementById('screen-' + s);
      el.style.display = s === name ? 'block' : 'none';
    });
    document.querySelectorAll('.screen-btn').forEach((b, i) => {
      b.classList.toggle('active', ['calendar','camera','recap'][i] === name);
    });
  }
  show('calendar');
</script>
</body>
</html>
